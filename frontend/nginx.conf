server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in address lookup. Without this, nginx finds the backend's
    # address once at startup, then hangs if the backend stops or moves.
    resolver 127.0.0.11 valid=5s;

    # Forward /api/tasks to the backend's /tasks. "backend" is the service name
    # from docker-compose.yml. Using a variable makes nginx look it up each time.
    location /api/ {
        set $backend http://backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
