services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    healthcheck:
      # The slim Python image has no curl, so use Python to call /health.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
